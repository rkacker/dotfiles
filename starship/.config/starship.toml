# Monaspace-compatible, informative but clean
format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "\ue0a0 "
style = "bold purple"

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"

[python]
disabled = true

[cmd_duration]
min_time = 2_000
format = "took [$duration](bold yellow) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
